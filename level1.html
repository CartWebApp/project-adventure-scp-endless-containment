<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="Stylesheet" href="back.css">
    <link rel="icon" type="image/png" href="images/scpfavicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 1</title>
</head>
<body>
    <header id="bars">
    <div id="healthbar">
        <label for health><img class=symbol src="images/hrt.png">HP</label>
        <progress id="health" value="100" max="100"></progress>
    </div>
    <div id="sanitybar">
        <label for sanity><img class=symbol src="images/brain.png">Sanity</label>
        <progress id="sanity" value="20" max="20"></progress>
    </div>
</header>

<section id="inventory">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
</section>

    <section id="THEcontainer">
    <img id="roomImage" src="" alt="Room" class="rotate0">
        <img src="images/arrow.png" class="arrow" onclick="changeImage()">
        <img src="images/arrow.png" class="arrow" onclick="changeImage()">
        <img src="images/arrow.png" class="arrow" onclick="changeImage()">
        <img src="images/arrow.png" class="arrow" onclick="changeImage()">
    </section>
    
    <img id="mappy" src="images/im the map.png">
    <section id="mappytainer">
    <div id="exit"></div>
    <div id="player"></div>
</section>

<section class="loguetainer">
    <p id="story"></p>
    <div id="dialogue"></div>
</section>

    <audio controls autoplay loop class="autio">
        <source src="backrooms-humming-sound-made-with-Voicemod.mp3" type="audio/mpeg">
    </audio>


</body>
<script src="rooms.js"></script>
</html>
